# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: 'Default'   # 👈 Your agent pool name
  demands:
    - Agent.OS -equals Linux   # Optional (Linux/Windows/Mac)

steps:
- script: echo "Hello, world from self-hosted agent!"
  displayName: 'Run a one-line script'

- script: |
    echo "Running on self-hosted agent"
    echo "Add build, test, and deployment steps here"
    echo "Reference: https://aka.ms/yaml"
  displayName: 'Run a multi-line script'